<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Shop</title>
    <style>
        *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;
        }

        body {
            font-family: "Montserrat", sans-serif;
            color: var(--tg-theme-text-color);
            background: var(--tg-theme-bg-color);
        }
        #main {
        width: 100%;
        padding: 20px;
        text-align: center;
        }
        #form{
        display:none;
        text-align:center;
        }
        h1 {
        margin-top: 50px;
        margin-bottom: 19px;
        }
        img{
            width: 70px;
            margin: 30px auto;
        }
        p{
            width:350px;
            margin: 0 auto;
        }
        button{
            border: 8;
            border-radius: 5px;
            margin-top: 58px;
            height: 68px;
            width: 280px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 560ms ease;
            color: var(--tg-theme-button-text-color);
            background: var(--tg-theme-button-color);
        }
        button:hover {
            background: var(--tg-theme-secondary-bg-color);
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Онлайн магазин</h1>
        <img src="photo/iphon16e.jpg">
        <p>lorem dcscdsv</p>
        <button type="button" id="buy">Купить</button>
    </div>
    <form id="form">
        <input type="text" placeholder="Имя" id="user_name">
        <input type="text" placeholder="Email" id="user_email">
        <input type="text" placeholder="Телефон" id="user_phone">
        <div id="error"></div>
        <button type="button" id="order">Оформить</button>
    </form>
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    alert("JS РАБОТАЕТ");

    if (!window.Telegram || !window.Telegram.WebApp) {
        alert("Telegram WebApp НЕ НАЙДЕН");
    } else {
        alert("Telegram WebApp подключен");
    }

    let tg = window.Telegram.WebApp;
    let buy = document.getElementById("buy");
    buy.addEventListener("click", () => {
        alert("КНОПКА КУПИТЬ НАЖАТА");
    let order = document.getElementById("order");

    tg.expand();

    buy.addEventListener("click", () => {
        document.getElementById("main").style.display = "none";
        document.getElementById("form").style.display = "block";

        if (tg.initDataUnsafe?.user) {
            document.getElementById("user_name").value =
                tg.initDataUnsafe.user.first_name + " " +
                (tg.initDataUnsafe.user.last_name || "");
        }
    });

    order.addEventListener("click", (e) => {
        e.preventDefault();
        document.getElementById("error").innerText = "";
        let name = document.getElementById("user_name").value;
        let email = document.getElementById("user_email").value;
        let phone = document.getElementById("user_phone").value;

        if (name.length < 5) {
            document.getElementById("error").innerText = "Ошибка в имени";
            return;
        }
        if (email.length < 5) {
            document.getElementById("error").innerText = "Ошибка в Email";
            return;
        }
        if (phone.length < 5) {
            document.getElementById("error").innerText = "Ошибка в телефоне";
            return;
        }

        let data = { name, email, phone };

        tg.sendData(JSON.stringify(data));
        tg.close();
    });
</script>
</body>
</html>
