<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Битва тридцати (1351) - Интерактивная карта сражения</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="style_30.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚔️ Битва тридцати (26 марта 1351) ⚔️</h1>
        <p>Англичане и наёмники против французских рыцарей и оруженосцев • Хронология 5 часов 40 минут (18 кадра)</p>
    </div>
    <div class="map-container">
        <div id="battleMap"></div>
    </div>
    <div class="controls">
        <div class="time-slider">
            <input type="range" id="timelineSlider" min="0" max="23" step="1" value="0">
        </div>
        <div class="time-display" id="timeLabel">00:00</div>
        <button id="playBtn">▶ Воспроизвести</button>
        <button id="resetBtn">⏹ Сброс</button>
        <div class="legend">
            <span>🟢 Союзные</span> <span>🔴 Вражеские</span> <span>⚫ Мертвые</span>
            <span>● Англичане</span> <span>■ Наёмники</span> <span>▲ Франц. рыцари</span> <span>◆ Оруженосцы</span>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Основной скрипт -->
<script src="index_30.js"></script>
</body>
</html>
